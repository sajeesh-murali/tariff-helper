spring:
  application:
    name: tariff-helper
  servlet:
    multipart:
      # Payslip PDFs only. Kept in step with PayslipController.MAX_BYTES.
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  # Set FORWARD_HEADERS=native only when running behind a trusted proxy/load balancer, so the rate
  # limiter sees the real client address. Without a proxy leave it as none (headers could be spoofed).
  forward-headers-strategy: ${FORWARD_HEADERS:none}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  # Every estimate may cost a Claude call. Limits apply to POST /api/estimates only.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    per-client-per-minute: ${RATE_LIMIT_PER_MINUTE:5}
    global-per-day: ${RATE_LIMIT_PER_DAY:500}
  # Comma-separated origins allowed to call the API from a browser, e.g. https://app.example.com. Empty = closed.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  llm:
    # openrouter = OpenRouter, Claude Haiku 5.5 by default (default); needs the OPENROUTER_API_KEY environment variable
    # llama     = open-source Llama via Ollama or a hosted OpenAI-compatible server (default)
    # openai    = OpenAI; needs the OPENAI_API_KEY environment variable
    # anthropic = Claude; needs the ANTHROPIC_API_KEY environment variable
    # stub      = placeholder result, no external calls
    provider: ${LLM_PROVIDER:openrouter}
    openrouter:
      # Never put the key in this file. It is read from the environment.
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:anthropic/claude-haiku-5.5}
      base-url: https://openrouter.ai/api
      max-tokens: 1500
      timeout-seconds: 60
    llama:
      # Local default is Ollama (no key). On the web, set LLAMA_BASE_URL to a hosted provider and LLAMA_API_KEY to
      # its key, for example Groq: https://api.groq.com/openai. Leave off /v1: the client adds /v1/chat/completions.
      # Never put the key in this file. It is read from the environment.
      api-key: ${LLAMA_API_KEY:}
      model: ${LLAMA_MODEL:llama3.1}
      base-url: ${LLAMA_BASE_URL:http://localhost:11434}
      max-tokens: 1500
      timeout-seconds: 120
    openai:
      # Never put the key in this file. It is read from the environment.
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: https://api.openai.com
      max-tokens: 1500
      timeout-seconds: 60
    claude:
      # Never put the key in this file. It is read from the environment.
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CLAUDE_MODEL:claude-sonnet-5-5}
      base-url: https://api.anthropic.com
      max-tokens: 1500
      timeout-seconds: 60

# Privacy: never log request or response bodies. Keep logging at INFO.
logging:
  level:
    root: INFO
