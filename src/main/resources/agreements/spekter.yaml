#    2021. The 2025 A2 protocol could not be fetched.
#  - Actual pay differs by hospital trust (a Nov 2024 comparison shows different figures for Helse Stavanger
#    and Helse Fonna), so a single national figure would be misleading.
#  - Which position group nurses and health care workers belong to was not confirmed.
# To finish: the current A2 protocol (minimum pay tables), Del B and the position-group list are needed
