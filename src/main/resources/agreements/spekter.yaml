unavailableReason: >-
  Hospital pay under the Spekter agreement depends on a position group, a yearly negotiated minimum pay table
  and, in practice, on the individual hospital trust, and we could not yet read the current rules and tables.
  We prefer no estimate to a wrong one. Spekter minimum pay steps up at 4, 8, 10 and 16 years of seniority, so
  correct seniority matters. If you work in a hospital, ask your employer or union representative how your earlier
  experience was counted.
