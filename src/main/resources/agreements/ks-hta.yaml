# KS Hovedtariffavtale (municipalities). Pilot rules.
#
# Sources (checked October 2026):
#  - Rules: HTA chapter 1 § 12 "Ansiennitet"; municipal application guides
#    (Lørenskog kommune, Sørfold kommune, Skaun kommune).
#  - Pay: "Garantilønn/laveste årslønn og tillegg for ansiennitet kapittel 4 pr. 1. mai 2026",
#    cross-checked against the 1.5.2026 pay ladder for 3-year higher-education positions.
#
# NOT verified: the final text of the 2026 agreement (mediated 29 May 2026, member vote closed
# 18 June 2026). § 12 is assumed unchanged from the 2024-2026 agreement.
id: ks-hta
name: KS Hovedtariffavtale (municipalities)
sector: municipal
status: available
effectiveFrom: "2026-05-01"

jobCategories:
  - id: nurse
    label: Nurse (sykepleier)
    educationRequired: true
    salaryGroup: "201"
  - id: specialist_nurse
    label: Specialist nurse (spesialsykepleier)
    educationRequired: true
    salaryGroup: "202"
  - id: kindergarten_teacher
    label: Kindergarten teacher (barnehagelærer)
    educationRequired: true
    salaryGroup: "201"
  - id: health_care_worker
    label: Health care worker (helsefagarbeider)
    educationRequired: true
    salaryGroup: "102"
    note: >-
      We assumed a position that requires a trade certificate (fagbrev) counts as having an
      education requirement. This has not been confirmed in the rules we found.
  - id: kindergarten_assistant
    label: Kindergarten assistant (barnehageassistent)
    educationRequired: false
    salaryGroup: "101"
    note: >-
      We assumed this position has no specific education requirement (pay group 101).
      Check the position code in your employment contract.
  - id: care_assistant
    label: Care assistant (pleie- or omsorgsassistent)
    educationRequired: false
    salaryGroup: "101"
    note: >-
      We assumed this position has no specific education requirement (pay group 101).
      Check the position code in your employment contract.

rules:
  careWorkMaxYears: 3
  homeWorkMaxYears: 6

# Minimum annual pay at 100% position, from 1 May 2026.
# Pay steps up from 6, 8, 10 and 16 completed years of seniority.
