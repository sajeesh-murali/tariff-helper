rulesSummary: |
  Source: KS Hovedtariffavtale (HTA) chapter 1 § 12 "Ansiennitet" and how municipalities apply it.
  - Seniority (lønnsansiennitet) is counted from age 18 at the earliest.
  - Public-sector service counts in full.
  - Private-sector service counts in full for positions WITHOUT a specific education requirement.
    For positions WITH an education requirement, private service counts only if it is "of importance
    for the position" (the employer decides).
  - Care work (caring for children, or for elderly or sick people) counts up to 3 years in total.
    It must be documented and must not overlap paid work or education.
  - Work in the home counts up to 6 years in total, and only for positions WITHOUT an education requirement.
  - Military service counts in full.
  - Part-time work counts as full time for the period it lasted.
  - A period is never counted under more than one provision.
  - Periods without documentation are not counted.
  - Self-employment is assessed by the employer, usually from tax records, and may count only partly.
  - The agreement sets MINIMUM pay (garantilønn) per position group. Minimum pay rises at 6, 8, 10 and 16
    completed years of seniority. The employer may pay more than the minimum.

caveats:
  - >-
    Tallene er minstelønnen (garantilønn) i hovedtariffavtalen for stillingsgruppen din, for en heltidsstilling. Arbeidsgiveren din kan allerede betale, eller kan være villig til å betale, mer enn minstelønnen.
  - >-
    Minstelønnen øker bare ved 6, 8, 10 og 16 år med ansiennitet som teller. Noen få ekstra måneder med ansiennitet som teller endrer kanskje ikke minstelønnen i det hele tatt.
  - >-
    Ansiennitet teller tidligst fra fylte 18 år. Dette anslaget kontrollerer ikke alderen din.
  - >-
    Hver periode må dokumenteres (arbeidsgiver, datoer, og timer eller stillingsprosent). Perioder uten dokumentasjon telles ikke.
  - >-
    Noen arbeidsgivere endrer ansienniteten din først fra datoen de mottar dokumentene dine, ikke med tilbakevirkende kraft. Spør arbeidsgiveren din.
  - >-
    Timelønnet arbeid eller arbeid på tilkallingsvakt teller bare hvis det i gjennomsnitt var minst 14 timer per uke over minst seks måneder.
  - >-
    Reglene vi brukte omtaler ikke arbeid i utlandet spesielt. Arbeidsgiveren din avgjør hvordan det vurderes og hvilken dokumentasjon som godtas.
  - >-
    Basert på lønnstabellene som gjelder fra 1. mai 2026.
