# Oslo kommune (own agreement, "Dokument 25" overenskomst). Pilot rules, nurse groups only.
#
# Sources (checked October 2026):
#  - Seniority rules: Dok. 25 for 1.5.2022-30.4.2024, chapter 12 "Lønnsansiennitet" (read via a
#    copy on Law Insider), and Lektorlaget's guide "Beregning av ansiennitet i Oslo kommune", which
#    cites the same rules as Del A § 9.8 of the later agreements (2024-2026). Same content, new numbering.
#    The FO summary of the 2026 settlement reports no change to the ansiennitet rules or to the pay-frame
#    (lønnsramme) system.
#  - Pay: NSF "Oslo kommune" pay page, tables "valid from 1 May 2026" for stillingskode 58 (ramme 2601),
#    59/60/61 (ramme 3001) and 94 (ramme 3009). Each row is seniority year -> lønnstrinn -> NOK.
#    The figures are for the LOWEST alternativ of the ramme (alternativ 01).
#
# NOT verified:
#  - The final text of Dok. 25 for 2026-2028 was not read (the PDF could not be opened as text).
#  - Other job groups (helsefagarbeider, barnehagelærer, assistants): their lønnsramme and pay tables
#    could not be obtained in readable form, so they are not offered for Oslo yet.
#  - Whether the care-work limits add up exactly as modelled (2 years, shared with uncertain work in the home).
id: oslo-kommune
name: Oslo kommune (own agreement)
sector: municipal-oslo
status: available
effectiveFrom: "2026-05-01"

jobCategories:
  - id: nurse
    label: Nurse (sykepleier, stillingskode 58)
    educationRequired: true
    salaryGroup: "2601"
    note: >-
      The figures are for the lowest alternativ (alternativ 01) of lønnsramme 26. Oslo employers often
      offer a higher alternativ, and nurses can negotiate it when they are hired. Your actual offer may be higher.
  - id: specialist_nurse
    label: Specialist nurse, public health nurse or midwife (spesialutdannet sykepleier, helsesykepleier, jordmor; stillingskode 59, 60, 61)
    educationRequired: true
    salaryGroup: "3001"
    note: >-
      The figures are for the lowest alternativ (alternativ 01) of lønnsramme 30. Specialist nurses in geriatrics
      and psychiatry are placed one alternativ higher (lønnsramme 3002), which this estimate does not include.
  - id: clinical_nurse
    label: Clinical nurse (klinisk sykepleier, stillingskode 94)
    educationRequired: true
    salaryGroup: "3009"
    note: >-
      The figures are for the lowest alternativ (3009) of lønnsramme 30. This position is for nurses with a
      relevant master's degree where the job requires it.

rules:
  # Care work (children, elderly, sick) counts up to 2 years. A further 4 years are credited only in positions with
  # special care functions, which the nurse groups here are not assumed to be.
  careWorkMaxYears: 2
  # Work in the home is not mentioned. It is treated as uncertain (possibly care work), sharing the 2-year limit.
  homeWorkMaxYears: 2
  # All private and public service with fixed agreed hours counts in full: no split by education or relevance.
  privateService: ALWAYS_FULL
  homeWork: POSSIBLE_ONLY

# Minimum annual pay at 100% position, lowest alternativ, from 1 May 2026.
