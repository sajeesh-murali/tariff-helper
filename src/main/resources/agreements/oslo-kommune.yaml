rulesSummary: |
  Source: Oslo kommune's own agreement (Dokument 25), the rules on lønnsansiennitet (seniority), and how Oslo
  places positions in a pay frame (lønnsramme).
  - Seniority is counted from age 18 at the earliest. It is fixed when the person is hired.
  - ALL public and private service with fixed agreed working hours counts in full. Unlike the KS agreement,
    there is no split by education requirement or by how related the work is to the position.
  - Hourly or extra-help (ekstrahjelp) work of at least 700 hours in a year counts as one year of seniority.
  - Care work (caring for children, elderly or sick people) counts up to 2 years. A further 4 years count only
    in positions with special care functions.
  - Work in the home is not mentioned in the rules. It may be accepted as care work, so it is uncertain and the
    employer decides.
  - Military service (verneplikt) counts.
  - Two years of an apprenticeship count for people hired as skilled workers.
  - Unpaid leave counts up to 1 year, and unpaid leave for further education up to 3 years.
  - A period is never counted under more than one provision. Employment of less than one month is not credited
    unless hourly work adds up to 700 hours.
  - Pay: each position (stillingskode) belongs to one pay frame (lønnsramme) with 25 alternatives (alternativ).
    Seniority years 0 to 16 give a pay step (lønnstrinn) that moves up automatically. Seniority and pay step
    cannot be negotiated, but the alternativ can be negotiated at hiring. The figures in this estimate are for the
    lowest alternativ, so the employer may offer more.

caveats:
  - >-
    The figures are pay for the LOWEST alternativ of your pay frame (lønnsramme), full time. Oslo kommune often offers a
    higher alternativ, and it can be negotiated at hiring, so your offer may already be higher than these figures.
  - >-
    Your seniority (years) decides your pay step and cannot be negotiated. That is why correct seniority matters.
  - >-
    Experience counts from age 18 at the earliest. This estimate does not check your age.
  - >-
    Every period must be documented (employer, dates, and working hours or position percentage). Only work with
    fixed agreed working hours counts in full. Hourly or on-call work needs at least 700 hours in a year to count as a year.
  - >-
    Work in another country is not mentioned specifically in the rules we found. Your employer decides how it is assessed
    and what documentation it accepts.
  - >-
    Oslo kommune also pays supplements that are not included here, for example a supplement based on total
    service in Oslo kommune (stabiliseringstillegg).
  - >-
    Only nurse positions are available for Oslo kommune so far. Other roles (for example health care worker or
    kindergarten staff) have their own pay frames that we could not read yet.
  - >-
    Based on the pay tables valid from 1 May 2026. The seniority rules are from the 2022-2024 agreement and later
    guides; the 2026-2028 agreement text was not read.
