rulesSummary: |
  Source: FUS tariff agreement 2024-2026, HTA § 12 "Ansiennitet".
  - Seniority (lønnsansiennitet) is counted from age 18 at the earliest.
  - All earlier public and private service counts in full, also outside the kindergarten or health sector.
  - Care work (caring for children, or for elderly or sick people) counts up to 3 years in total.
    It must be documented.
  - Work in the home counts up to 6 years in total, and only for positions WITHOUT an education requirement.
  - Overlapping periods are counted once.
  - Periods without documentation are not counted.
  - Self-employment must be documented with the work actually done, not only a registered business.
  - The agreement sets MINIMUM pay per position group. Minimum pay rises at 4, 8, 10 and 16 completed years of
    seniority. The employer may pay more than the minimum.

caveats:
  - >-
    The figures are the minimum pay in the agreement for your position group, for a full-time position.
    Your employer may already pay, or may be willing to pay, more than the minimum.
  - >-
    Minimum pay rises only at 4, 8, 10 and 16 years of counted experience. A few extra months of counted experience
    may not change the minimum at all.
  - >-
    Experience counts from age 18 at the earliest. This estimate does not check your age.
  - >-
    Every period must be documented (employer, dates, and hours or position percentage).
    Periods without documentation are not counted.
  - >-
    Hourly-paid or on-call work may be subject to a special rule (an average of at least 14 hours per week
    over a period of at least six months). This estimate does not check it.
  - >-
    The rules do not cover work abroad specifically. Your employer decides how it is assessed
    and what documentation it accepts.
  - >-
    The pay table is from 1 May 2025 and the agreement is running on extended validity. Newer minimum pay
    may apply. Ask your employer which table is used now.
  - >-
    Based on the pay table valid from 1 May 2025.
