# FUS (Trygge Barnehager), private kindergartens. Pilot rules. OLD PAY TABLE.
#
# Sources (read via the Lansi page ansiennitet/barnehage, reviewed 30 September 2026):
#  - Rules: FUS tariff agreement 2024-2026, HTA § 12.1-12.7
#    https://apim-fagf-prod.azure-api.net/legacy/v1/Agreement/files/24da7419-d2ab-ef11-b8e9-0022489c9267/tariffavtale%20fus%202024-2026%20%283%29.pdf
#  - Status: Utdanningsforbundet says the agreement applies on extended validity (ettervirkning) while a new one is
#    negotiated after FUS joined NHO Geneo. FUS staff are not automatically under NHO 590.
#    https://www.utdanningsforbundet.no/lonn-og-arbeidsvilkar/tariffavtaler/fus-trygge-barnehager/fus-blir-medlem-i-nho-geneo
#  - Pay: table valid from 1 May 2025 (the latest verified), https://www.fagforbundet.no/lonn-og-avtaler/fus/
#
# NOT verified:
#  - The pay table is from 2025. Newer figures were not found, so the estimate is probably too LOW.
#  - The figures and rules were taken from the Lansi guide pages (src/main/resources/static) and have not been checked against the PDF files named above. Check them against the PDFs before relying on the output.
#  - Unpaid parental leave (up to 3 years) and the 14-hour rule for hourly-paid work (§ 12.7) are not modelled.
id: fus
name: FUS Trygge Barnehager (private kindergartens, extended validity)
sector: private-kindergarten
status: available
effectiveFrom: "2025-05-01"

jobCategories:
  - id: kindergarten_assistant
    label: Kindergarten assistant (barnehageassistent)
    educationRequired: false
    salaryGroup: "assistant"
    note: >-
      We assumed this position has no specific education requirement. Check the position code in your employment contract.
  - id: skilled_worker
    label: Child and youth worker (barne- og ungdomsarbeider)
    educationRequired: true
    salaryGroup: "child-youth-worker"
    note: >-
      We assumed a position that requires a trade certificate (fagbrev) counts as having an education requirement. This has not been confirmed in the rules we found.
  - id: kindergarten_teacher
    label: Kindergarten teacher (barnehagelærer)
    educationRequired: true
    salaryGroup: "kindergarten-teacher"
  - id: pedagogical_leader
    label: Pedagogical leader (pedagogisk leder)
    educationRequired: true
    salaryGroup: "pedagogical-leader"
  - id: special_educator
    label: Special educator (spesialpedagog)
    educationRequired: true
    salaryGroup: "special-educator"

rules:
  careWorkMaxYears: 3
  homeWorkMaxYears: 6
  # All earlier public and private service counts in full: no split by education or relevance.
  privateService: ALWAYS_FULL
  homeWork: IF_NO_EDUCATION_REQUIREMENT

# Minimum annual pay at 100% position, from 1 May 2025. Pay steps up from 4, 8, 10 and 16 completed years.
